<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A note-taking app for video lessons: timestamped notes, pause reminders, easy reordering, summaries and a flashcard quiz.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Scribble">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1424" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Scribble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&display=swap">
<style>
/* Layout: one narrow notebook column. Sticky header + tabs on top; in "Take notes" the composer is pinned to the bottom so typing never needs scrolling. Timestamps sit in the sheet's left margin, like a Cornell cue column. */
:root{
  --paper:#EDF1F7;
  --sheet:#FFFFFF;
  --ink:#13203B;
  --muted:#56637F;
  --rule:#D6DEEB;
  --margin:#EBB7BF;
  --accent:#2747C7;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3E8FA;
  --hi:#FFE14D;
  --hi-ink:#2E2600;
  --t-key:#2747C7;
  --t-def:#12805A;
  --t-ex:#7446BE;
  --t-q:#B65310;
  --t-rewatch:#B32340;
  --t-test:#7A5E00;
  --ok:#12805A;
  --danger:#B32340;
  --shadow:0 1px 2px rgba(19,32,59,.07),0 8px 24px rgba(19,32,59,.06);

  --f-display:"Recursive",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Recursive",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r:10px;
  --maxw:720px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1424;--sheet:#152038;--ink:#E7ECF6;--muted:#9CA9C5;--rule:#26345A;--margin:#5A3442;
  --accent:#8AA2FF;--accent-ink:#0D1424;--accent-soft:#1E2C52;--hi:#F2D33D;--hi-ink:#231C00;
  --t-key:#8AA2FF;--t-def:#4FD19B;--t-ex:#C4A1FF;--t-q:#FFA866;--t-rewatch:#FF7F98;--t-test:#F2D33D;
  --ok:#4FD19B;--danger:#FF7F98;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1424;--sheet:#152038;--ink:#E7ECF6;--muted:#9CA9C5;--rule:#26345A;--margin:#5A3442;
  --accent:#8AA2FF;--accent-ink:#0D1424;--accent-soft:#1E2C52;--hi:#F2D33D;--hi-ink:#231C00;
  --t-key:#8AA2FF;--t-def:#4FD19B;--t-ex:#C4A1FF;--t-q:#FFA866;--t-rewatch:#FF7F98;--t-test:#F2D33D;
  --ok:#4FD19B;--danger:#FF7F98;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.brand{font-family:var(--f-display);font-variation-settings:"CASL" 1;font-weight:800;font-size:1.5rem;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:var(--s2)}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(#FFE45C,#F5C518);display:grid;place-items:center;flex:none}
.brand-mark svg{width:15px;height:21px;display:block}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.top-title{min-width:0;flex:1}
.top-title .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title h1{margin:0;font-family:var(--f-display);font-variation-settings:"CASL" .6;font-weight:750;font-size:1.05rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--danger)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:0 var(--s2)}
.tab{border:0;background:none;padding:8px 2px;border-radius:8px;font-weight:700;font-size:.84rem;white-space:nowrap;min-width:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab small{font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-weight:500;font-size:.7rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}

main.wrap{padding-block:var(--s4) var(--s6)}

/* Generic */
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.warn{color:var(--t-rewatch)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn.small{min-height:34px;padding:6px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);padding:var(--s4)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.row-wrap{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);margin:0 0 var(--s2)}
h2.h{font-family:var(--f-display);font-variation-settings:"CASL" .8;font-weight:800;font-size:1.3rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3.h{font-family:var(--f-display);font-variation-settings:"CASL" .5;font-weight:750;font-size:1.05rem;margin:0}
.mono{font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-variant-numeric:tabular-nums}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:10px 12px}
textarea.field{resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:30;max-width:calc(100vw - 32px);text-align:center}

/* Library */
.hero{display:flex;flex-direction:column;gap:var(--s2);padding-block:var(--s2) var(--s2)}
.hero h2{font-family:var(--f-display);font-variation-settings:"CASL" 1;font-weight:850;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h2 mark{background:linear-gradient(transparent 55%,var(--hi) 55%,var(--hi) 92%,transparent 92%);color:inherit;padding:0 2px}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.lesson-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.lesson{display:block;width:100%;text-align:left;border:0;padding:var(--s4)}
.lesson .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.lesson .title{font-family:var(--f-display);font-variation-settings:"CASL" .5;font-weight:750;font-size:1.1rem;margin:2px 0 6px;line-height:1.3}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.demo{display:flex;flex-direction:column;gap:var(--s3)}
.demo video{display:block;width:auto;max-width:100%;max-height:70vh;margin:0 auto;border-radius:12px;background:var(--paper);border:1px solid var(--rule)}
.demo p{margin:0;font-size:.88rem;color:var(--muted)}
.routine ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s3);counter-reset:r}
.routine li{display:grid;grid-template-columns:28px 1fr;gap:var(--s3);counter-increment:r}
.routine li::before{content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.85rem;font-family:var(--f-mono);font-variation-settings:"MONO" 1}
.routine li p{margin:0;font-size:.95rem}
.routine li b{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.newform{display:grid;gap:var(--s3)}
/* Home for returning users */
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;padding-top:var(--s2)}
.home-h{font-family:var(--f-display);font-variation-settings:"CASL" 1;font-weight:850;font-size:clamp(1.5rem,5vw,1.9rem);line-height:1.1;margin:0;letter-spacing:-.02em}
.home-sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.cont{display:flex;flex-direction:column;gap:var(--s3);border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--rule))}
.cont .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.cont h3{font-family:var(--f-display);font-variation-settings:"CASL" .5;font-weight:800;font-size:1.25rem;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.cont .meta{font-size:.85rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:.74rem;font-weight:700;color:var(--muted);min-width:0}
.steps li::before{content:"";height:6px;border-radius:99px;background:var(--rule)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--accent)}
.steps li.now{color:var(--ink)}
.steps li.now::before{background:var(--hi)}
.next{display:flex;flex-direction:column;gap:var(--s3);background:var(--paper);border-radius:12px;padding:var(--s3)}
.next b{display:block;font-size:.98rem}
.next span{font-size:.88rem;color:var(--muted)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.list-head .label{margin:0}
.seg2{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.84rem;color:var(--muted);min-height:34px}
.seg2 button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.grp{display:flex;flex-direction:column;gap:var(--s2)}
.grp-h{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s2) 0 0;font-family:var(--f-display);font-variation-settings:"CASL" .5;font-weight:800;font-size:1rem}
.grp-h span{font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--muted)}
.groups{display:flex;flex-direction:column;gap:var(--s4)}
.lrow{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.lmain{min-width:0}
.ldate{flex:none;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.dots{display:inline-grid;grid-auto-flow:column;gap:4px}
.dots i{display:block;width:16px;height:5px;border-radius:99px;background:var(--rule)}
.dots i.on{background:var(--accent)}
.lnum{font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-size:.72rem;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
details.how{padding:0}
details.how>summary{list-style:none;cursor:pointer;padding:var(--s4);display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font-weight:700}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--muted)}
details.how[open]>summary::after{content:"–"}
details.how>summary small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.how-body{display:flex;flex-direction:column;gap:var(--s4);padding:0 var(--s4) var(--s4)}
.how-body .demo,.how-body .routine{box-shadow:none;padding:0;background:none}
.empty{text-align:center;padding:var(--s6) var(--s4)}
.empty p{margin:var(--s2) auto var(--s4);max-width:40ch}

/* Clock */
.clock{display:flex;flex-direction:column;gap:var(--s3)}
.clock-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.clock-time{border:0;background:none;padding:0;font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock-time.running{color:var(--accent)}
.clock-time-input{font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-size:1.6rem;width:9ch;padding:4px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--sheet)}
.clock-lbl{font-size:.8rem;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.meter span{display:block;height:100%;background:var(--hi);border-radius:99px;transition:width .4s linear}
.clock-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center;font-size:.86rem;color:var(--muted)}
.clock-meta select{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:4px 8px}
.nudge{background:var(--hi);color:var(--hi-ink);border-radius:14px;padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;justify-content:space-between;font-weight:700;animation:pop .35s ease-out}
.nudge .btn{background:var(--hi-ink);color:var(--hi);border-color:var(--hi-ink)}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}

/* Notebook sheet */
.sheet{background:var(--sheet);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:58px;width:1.5px;background:var(--margin)}
.notes{list-style:none;margin:0;padding:var(--s2) 0}
.note{display:grid;grid-template-columns:58px 1fr;align-items:baseline;min-height:40px;border-bottom:1px solid var(--rule);position:relative}
.note:last-child{border-bottom:0}
.note .ts{font-family:var(--f-mono);font-variation-settings:"MONO" 1;font-size:.74rem;color:var(--muted);text-align:right;padding:10px 10px 0 0;font-variant-numeric:tabular-nums}
.note .body{padding:8px 14px 8px 14px;min-width:0;overflow-wrap:anywhere}
.note[data-level="1"] .body{padding-left:34px}
.note[data-level="2"] .body{padding-left:54px}
.note[data-level="1"] .body::before,.note[data-level="2"] .body::before{content:"";position:absolute;margin-left:-14px;margin-top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.note.section .body{font-family:var(--f-display);font-variation-settings:"CASL" .7;font-weight:800;font-size:1.05rem;padding-top:14px;padding-bottom:6px}
.note.section{border-bottom:2px solid var(--ink)}
.txt{white-space:pre-wrap}
/* tables typed into notes: each row note shows its cells in equal columns, so rows in a run line up */
.txt.trow{display:grid;white-space:normal;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
.trow .tc{min-width:0;padding:3px 6px;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;white-space:pre-wrap;font-size:.92em}
.trow .tc+.tc{border-left:1px solid var(--rule)}
.txt.trow.thead{font-weight:700;background:var(--accent-soft)}
.note.test .txt.trow{padding:0;background:color-mix(in srgb,var(--hi) 32%,var(--sheet))}
.trow-note{border-bottom-color:transparent}
.trow-note .body{padding-top:2px;padding-bottom:2px}
.trow-note .ts{padding-top:4px}
.txt.tsep{min-height:6px;background:repeating-linear-gradient(90deg,var(--rule) 0 6px,transparent 6px 10px);border:0;margin:6px 0}
.tscroll{display:block;overflow-x:auto;max-width:100%}
.ntable{border-collapse:collapse;white-space:normal;font-size:.95em;margin:2px 0}
.ntable th,.ntable td{border:1px solid var(--rule);padding:3px 6px;text-align:left;vertical-align:top;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.ntable th{background:var(--accent-soft);font-weight:700}
.note.test .txt{background:linear-gradient(transparent 40%,color-mix(in srgb,var(--hi) 75%,transparent) 40%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px;border:1px solid currentColor}
.tag.key{color:var(--t-key)}.tag.def{color:var(--t-def)}.tag.ex{color:var(--t-ex)}.tag.q{color:var(--t-q)}.tag.rewatch{color:var(--t-rewatch)}.tag.test{color:var(--t-test)}
.more-link{display:block;text-align:center;padding:10px;font-size:.88rem;color:var(--accent);background:none;border:0;width:100%;border-bottom:1px solid var(--rule);font-weight:700}
.sheet-empty{padding:var(--s5) var(--s4) var(--s5) 74px;color:var(--muted)}

/* Composer */
.composer{position:sticky;bottom:0;z-index:4;margin-top:var(--s4);background:var(--paper);padding-block:var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:var(--s2);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.test[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.comp-row{display:flex;gap:var(--s2);align-items:flex-end}
.comp-row textarea{flex:1;min-width:0;border:1.5px solid var(--rule);background:var(--sheet);border-radius:14px;padding:10px 14px;resize:none;max-height:40vh;line-height:1.45}
.comp-row textarea:focus{border-color:var(--accent);outline:none}
.comp-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.hint{font-size:.76rem;color:var(--muted)}
.hint code{font-family:var(--f-mono);font-variation-settings:"MONO" 1;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:0 4px}

/* Organize */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.org .note{cursor:pointer}
.org .note.sel{background:var(--accent-soft)}
.org .note.sel::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}

/* ---------- tables typed into notes: "Stage | Where | ATP" (one row per line or per note) ---------- */
const isSepCells = cells => cells.every(c => /^:?-+:?$/.test(c));
function tableCells(line) {

// Rows in a note, or null when the note isn't table text (every non-empty line must be a row).

  const one = n => n && n.tag !== "section" && n.level === first.level && noteTable(n.text)?.length === 1;
  const run = [first];

/* Notes grouped by section. Notes before the first section go in "Start of the lesson";
   a lesson with no sections is one group named after the lesson. Rewatch markers are left out. */
function sectionGroups(l) {
  const groups = []; let g = null;
  const hasSections = l.notes.some(n => n.tag === "section");
  l.notes.forEach(n => {
    if (n.tag === "section") { g = { id: n.id, title: n.text, t: n.t, notes: [], real: true }; groups.push(g); return; }
    if (n.tag === "rewatch") return;
    if (!g) { g = { id: "_start", title: hasSections ? "Start of the lesson" : l.title, t: n.t, notes: [], real: false }; groups.push(g); }
    g.notes.push(n);
  });
  return groups.filter(x => x.notes.length);
}
function buildDeck(l) {
  const cards = [];
  (l.ai?.questions || []).forEach(q => q && q.q && cards.push({ front: String(q.q), back: String(q.a || ""), src: "Practice question" }));
  l.notes.forEach((n, i) => {
    if (n.tag === "q") {
      const kids = [];
      for (let j = i + 1; j < l.notes.length && l.notes[j].level > n.level && l.notes[j].tag !== "section"; j++) kids.push(l.notes[j].text);
      cards.push({ front: n.text, back: kids.length ? kids.join("\n") : `Answer from memory, then check the video at ${fmt(n.t)}.`, src: "Your question" });
    }
    if (n.tag === "def") {
      const m = n.text.match(/^(.{1,80}?)\s*(?::|=| — | - )\s*([\s\S]+)$/);
      if (m) cards.push({ front: `Define: ${m[1]}`, back: m[2], src: "Your definition" });
    }
  });
  sectionGroups(l).filter(g => g.real).forEach(g => cards.push({
    front: `What do you remember about “${g.title.replace(/[\s:;,.–—-]+$/, "") || g.title}”?`,
    back: g.notes.map(n => "• " + n.text).join("\n"),
    src: "Section recall" + (g.t > 0 ? " · " + fmt(g.t) : ""), sec: g.id

  return cards;
}

/* ---------- AI ---------- */
function notesForAI(l) {
  return l.notes.map(n => `${"  ".repeat(n.level)}[${fmt(n.t)}]${n.tag ? " (" + TAGS[n.tag].label + ")" : ""} ${n.text}`).join("\n").slice(0, 60000);
}
function aiErrCopy(code) {
  switch (code) {
    case "cancelled": return "";
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed":
      S.sample = null; return "Claude isn't available here. Your key points and own summary still work.";
    case "rate_limited": return "Too many requests right now. Try again in a minute.";
    case "session_expired": return "Sign in to Claude again, then try once more.";
    case "prompt_too_large": return "These notes are too long to send at once. Try splitting the lesson.";
    case "refused": return "Claude couldn't work with these notes. Try editing them and ask again.";
    case "invalid_json": case "empty_completion": return "Claude's answer came back incomplete. Tap Summarize to try again.";
    default: return "Couldn't reach Claude. Tap Summarize to try again.";
  }
}
async function runAI(fresh) {
  const l = cur(); if (!l || !S.sample || S.aiBusy) return;
  const prompt = `A student took these notes while watching a recorded lesson titled "${l.title}"${l.course ? ` for the course "${l.course}"` : ""}. Each line has the video time, an optional note type, and the note. Indentation shows sub-points. Notes marked "On the test" are what the student thinks will be tested. Notes marked "Rewatch" are moments they missed.

NOTES:
${notesForAI(l)}

Reply with only a JSON object in this shape:
{"summary": ["3 to 6 short bullet sentences in plain language covering the main ideas"],
 "terms": [{"term": "a key term from the notes", "meaning": "a one-line meaning taken from the notes"}],
 "questions": [{"q": "a test-style question", "a": "a short answer"}],
 "gaps": ["up to 3 short things that look missing, unclear or marked to rewatch, with the video time if known"]}
Rules: use only what is in the notes; do not add outside facts. Up to 8 terms. Write 5 to 8 questions that mix recall and understanding, and favour notes marked "On the test". If the notes are thin, return fewer items.`;
  S.aiBusy = true; S.aiErr = ""; S.aiCtl = new AbortController(); render();
  try {
    const r = await S.sample.json(prompt, { signal: S.aiCtl.signal, cache: fresh ? false : true });
    if (!r || typeof r !== "object") throw { code: "invalid_json" };
    const arr = x => Array.isArray(x) ? x : [];
    l.ai = {
      summary: arr(r.summary).map(String).slice(0, 8),
      terms: arr(r.terms).filter(t => t && t.term).map(t => ({ term: String(t.term), meaning: String(t.meaning || "") })).slice(0, 10),
      questions: arr(r.questions).filter(q => q && q.q).map(q => ({ q: String(q.q), a: String(q.a || "") })).slice(0, 10),
      gaps: arr(r.gaps).map(String).slice(0, 4),
      at: Date.now(), noteCount: l.notes.filter(n => n.tag !== "section").length
    };
    S.quiz = null; persist(l);
  } catch (e) { S.aiErr = aiErrCopy(e && e.code); }
  S.aiBusy = false; S.aiCtl = null; render();
}


/* ---------- export: PDF and Word files, built here with no libraries (works offline) ---------- */
/* One document model feeds both files: title, meta, notes (with sections), key terms table, summaries, questions. */
function glossary(l) {
  const rows = [], seen = new Set();
  const add = (term, meaning, src) => { const k = term.trim().toLowerCase(); if (!k || seen.has(k)) return; seen.add(k); rows.push({ term: term.trim(), meaning: meaning.trim(), src }); };
  l.notes.forEach(n => { if (n.tag !== "def") return; const m = n.text.match(/^(.{1,80}?)\s*(?::|=| — | - )\s*([\s\S]+)$/); if (m) add(m[1], m[2], "notes"); });
  (l.ai?.terms || []).forEach(t => t && t.term && add(String(t.term), String(t.meaning || ""), "claude"));
  return rows;
}
function exportModel(l, extras = true) {
  const hasSections = l.notes.some(n => n.tag === "section");

/* Saving: the claude.ai version asks the viewer through the downloads capability; the GitHub Pages site downloads directly. */

    try { const r = await S.downloads.save({ filename: name, data: blob }); if (r?.status === "saved") toast("Saved " + name); else if (r?.status === "delivered") toast("Sent " + name); return true; }
    catch (err) {
      const c = err?.code;

      if (c === "rate_limited") { toast("A save is already waiting for you. Finish that one first."); return false; }
      if (c === "rejected_extension" || c === "extension_not_enabled") { toast("This file type can't be saved here. Try another format, or Copy text."); return false; }
      if (c === "bad_request" || c === "transform_error" || c === "too_large") { toast("Couldn't make that file. Try again, or use Copy text."); return false; }
      S.downloads = null;
    }
  }
  if (inFrame()) { toast("Saving files isn't available here. Use Copy text instead."); return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast("Downloaded " + name); return true;
}

/* ---------- backup and restore ---------- */
/* A backup is one JSON file with every lesson. Restoring merges: lessons you don't have are added,

function makeBackup() {

}
function backupName(d = new Date()) { const z = n => String(n).padStart(2, "0"); return `scribble-backup-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}.json`; }

  let data; try { data = JSON.parse(String(text).trim().replace(/^﻿/, "")); } catch { throw new Error("That isn't a Scribble backup. Choose the .json file you saved with “Save backup file”."); }
  if (Array.isArray(data)) data = { app: "Scribble", lessons: data };
  if (!data || data.app !== "Scribble" || !Array.isArray(data.lessons)) throw new Error("That file isn't a Scribble backup. Choose the .json file you saved with “Save backup file”.");
  const lessons = data.lessons.filter(l => l && typeof l === "object" && typeof l.id === "string" && l.id && Array.isArray(l.notes)).map(normalize);

}

  const add = [], update = [], keep = [];
  lessons.forEach(b => { const here = S.lessons.get(b.id); if (!here) add.push(b); else if ((b.updatedAt || 0) > (here.updatedAt || 0)) update.push(b); else keep.push(b); });
  return { add, update, keep };

  lsSet("scribble.v1.beforeRestore", JSON.stringify(S.preRestore));
  [...plan.add, ...plan.update].forEach(b => { const l = normalize(b); S.lessons.set(l.id, l); persist(l, false); });
  saveLocal();

  const keepIds = new Set(before.map(l => l.id));
  [...S.lessons.keys()].forEach(id => { if (!keepIds.has(id)) deleteLesson(id); });
  before.forEach(b => { const l = normalize(b); S.lessons.set(l.id, l); persist(l, false); });

async function saveBackup() {
  const data = makeBackup(), name = backupName(), text = JSON.stringify(data, null, 1), blob = new Blob([text], { type: "application/json" });
  let ok = false;

  const touch = window.matchMedia?.("(pointer: coarse)").matches;
  if (!S.downloads && !inFrame() && touch && navigator.canShare) {
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Scribble backup" }); ok = true; toast("Backup ready: " + name); }

  if (ok) {
    lsSet(BK_KEY, JSON.stringify({ at: Date.now(), lessons: data.lessons.length, notes: data.lessons.reduce((a, l) => a + l.notes.length, 0) }));

/* ---------- export: text ---------- */
function toMarkdown(l) {
  const out = [`# ${l.title}`, `${l.course ? l.course + " · " : ""}${new Date(l.createdAt).toLocaleDateString()}`, ""];
  for (let i = 0; i < l.notes.length; i++) {
    const n = l.notes[i];
    if (n.tag === "section") { out.push("", `## ${n.text}`); continue; }
    const tr = tableRun(l.notes, i);
    if (tr) { const md = r => "| " + r.map(c => c.replace(/\|/g, "\\|").replace(/\n/g, " ")).join(" | ") + " |"; out.push("", `[${fmt(n.t)}]`, "", md(tr.head), "| " + tr.head.map(() => "---").join(" | ") + " |", ...tr.rows.map(md), ""); i += tr.notes.length - 1; continue; }

    out.push(`${"  ".repeat(Math.max(0, n.level - (l.notes.some(x => x.tag === "section") ? 1 : 0)))}- [${fmt(n.t)}] ${n.text}${tag}`);
  }
  if (l.mySummary.trim()) out.push("", "## My summary", l.mySummary.trim());
  if (l.dump.trim()) out.push("", `## Brain dump (${new Date(l.dumpAt || Date.now()).toLocaleDateString()})`, l.dump.trim());
  if (l.ai?.summary?.length) out.push("", "## Claude's summary", ...l.ai.summary.map(s => "- " + s));
  if (l.ai?.questions?.length) out.push("", "## Practice questions", ...l.ai.questions.map((q, i) => `${i + 1}. ${q.q}\n   Answer: ${q.a}`));

}
